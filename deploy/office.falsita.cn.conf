# Office TLS: independent Let's Encrypt ECC certificate maintained by acme.sh (DNS-01).
map $uri $office_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=86400";
}
limit_req_zone $binary_remote_addr zone=office_presence_reads:1m rate=2r/s;
server {
    listen 80;
    listen [::]:80;
    server_name office.falsita.cn;
    access_log off;
    error_log /dev/null;
    return 308 https://office.falsita.cn$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name office.falsita.cn;
    ssl_certificate /etc/nginx/ssl/office.falsita.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/office.falsita.cn/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 4k;
    client_header_timeout 10s;
    send_timeout 15s;
    # Public read-only display explicitly requested by owner. Machine token stays in Node.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    root /opt/agent-office/current/dist;
    add_header Cache-Control $office_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location = /api/office/presence {
        limit_req zone=office_presence_reads burst=10 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5188;
        proxy_http_version 1.1;
        proxy_set_header Host office.falsita.cn;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /api/office/presence/ws {
        limit_req zone=office_presence_reads burst=10 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5188;
        proxy_http_version 1.1;
        proxy_set_header Host office.falsita.cn;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /api/ { return 404; }
    location = /index.html { try_files $uri =404; }
    location = / { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; }
    location / { return 404; }
}
