# Static Office + same-origin, read-only WSS relay. No Office Node service.
# This edge validates browser Origin before using the collector's anonymous machine path.
# Office TLS remains managed independently by acme.sh.
map $uri $office_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=86400";
}
limit_req_zone $binary_remote_addr zone=office_ws_handshakes:1m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=office_ws_per_ip:1m;
limit_conn_zone $server_name zone=office_ws_total:1m;
server {
    listen 80;
    listen [::]:80;
    server_name office.falsita.cn;
    access_log off;
    error_log /dev/null;
    return 308 https://office.falsita.cn$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name office.falsita.cn;
    ssl_certificate /etc/nginx/ssl/office.falsita.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/office.falsita.cn/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 4k;
    client_header_timeout 10s;
    send_timeout 15s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    root /opt/agent-office/current/dist;
    add_header Cache-Control $office_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location = /api/presence/v1/ws {
        # Only this public read-only path is relayed. No generic collector proxy.
        if ($request_method != GET) { return 405; }
        if ($http_origin != "https://office.falsita.cn") { return 403; }
        if ($args != "") { return 400; }
        if ($http_upgrade !~* "^websocket$") { return 426; }
        limit_req zone=office_ws_handshakes burst=5 nodelay;
        limit_req_status 429;
        limit_conn office_ws_per_ip 4;
        limit_conn office_ws_total 12;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:18788;
        proxy_http_version 1.1;
        proxy_set_header Host collect.falsita.cn;
        # Origin was checked above. The trusted loopback hop is a machine read,
        # not a browser session; do not forward ambient credentials or spoof Origin.
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 15s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /api/ { return 404; }
    location = /index.html { try_files $uri =404; }
    location = / { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; }
    location / { return 404; }
}
