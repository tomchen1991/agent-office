# Static Office only. Each browser connects directly to the collector.
# Office TLS remains managed independently by acme.sh.
map $uri $office_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=86400";
}
server {
    listen 80;
    listen [::]:80;
    server_name office.falsita.cn;
    access_log off;
    error_log /dev/null;
    return 308 https://office.falsita.cn$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name office.falsita.cn;
    ssl_certificate /etc/nginx/ssl/office.falsita.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/office.falsita.cn/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 4k;
    client_header_timeout 10s;
    send_timeout 15s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    root /opt/agent-office/current/dist;
    add_header Cache-Control $office_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # If VITE_PRESENCE_WS_URL changes host, update this explicit connect-src too.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://collect.falsita.cn; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location /api/ { return 404; }
    location = /index.html { try_files $uri =404; }
    location = / { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; }
    location / { return 404; }
}
